<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编程猫9月校区 · 积分查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090d;--panel:#0d1117;--surface:#161b22;--surface-2:#1c222b;
  --line:#1f2632;--line-2:#262d38;--text:#e6edf3;--text-2:#a8b3c0;
  --muted:#6b7683;--faint:#4a5361;--blue:#7aa2f7;--blue-2:#4f76c5;
  --purple:#9d7cd8;--green:#7ee787;--gold:#e0af68;--gold-2:#c99a4a;
  --red:#f7768e;--pink:#f0a0d0;--cyan:#7ee0f7;
  --mono:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,monospace;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  min-height:100vh;padding:32px 24px;-webkit-font-smoothing:antialiased;
  letter-spacing:.01em;position:relative;overflow-x:hidden;
}
#bgCanvas{position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:.85}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 600px at 10% 15%,rgba(122,162,247,.14),transparent 55%),
    radial-gradient(700px 500px at 90% 20%,rgba(157,124,216,.12),transparent 55%),
    radial-gradient(800px 500px at 50% 85%,rgba(126,231,135,.08),transparent 55%),
    radial-gradient(700px 400px at 15% 90%,rgba(224,175,104,.1),transparent 55%),
    radial-gradient(600px 400px at 85% 70%,rgba(126,224,247,.08),transparent 55%);
  animation:colorDrift 22s ease-in-out infinite alternate;
}
@keyframes colorDrift{
  0%{background-position:0% 0%,100% 0%,50% 100%,0% 100%,100% 100%;filter:hue-rotate(0deg)}
  50%{background-position:15% 10%,85% 10%,55% 90%,10% 90%,90% 75%;filter:hue-rotate(15deg)}
  100%{background-position:5% 20%,95% 15%,45% 95%,5% 85%,95% 80%;filter:hue-rotate(-10deg)}
}
body::after{
  content:'';position:fixed;inset:-50%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 600px 300px at 25% 35%,rgba(122,162,247,.1),transparent 50%),
    radial-gradient(ellipse 500px 250px at 75% 65%,rgba(157,124,216,.1),transparent 50%),
    radial-gradient(ellipse 400px 200px at 50% 15%,rgba(224,175,104,.06),transparent 50%);
  animation:auroraFlow 30s ease-in-out infinite;
}
@keyframes auroraFlow{
  0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}
  25%{transform:translate(3%,-2%) rotate(6deg) scale(1.05)}
  50%{transform:translate(-2%,3%) rotate(-5deg) scale(.98)}
  75%{transform:translate(2%,2%) rotate(3deg) scale(1.02)}
}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:1}
.float-spark{position:fixed;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:0;animation:floatSpark var(--dur,12s) ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes floatSpark{0%,100%{transform:translate(0,0) scale(1);opacity:.3}25%{transform:translate(20px,-30px) scale(1.5);opacity:.9}50%{transform:translate(-15px,-50px) scale(1);opacity:.5}75%{transform:translate(25px,-20px) scale(1.3);opacity:.8}}

.window{background:rgba(13,17,23,.82);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 40px 100px -40px rgba(0,0,0,.8),0 0 60px -20px rgba(122,162,247,.3),inset 0 1px 0 rgba(255,255,255,.05);position:relative}
.window::before{content:'';position:absolute;inset:-1px;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(122,162,247,.5),transparent 30%,transparent 70%,rgba(157,124,216,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7;animation:borderShine 8s linear infinite}
@keyframes borderShine{0%,100%{opacity:.4}50%{opacity:1}}

.hero{padding:48px 46px 40px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(122,162,247,.04),transparent 60%);overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(122,162,247,.08) 60deg,transparent 120deg,rgba(157,124,216,.08) 180deg,transparent 240deg,rgba(224,175,104,.06) 300deg,transparent 360deg);animation:heroRotate 40s linear infinite;pointer-events:none}
@keyframes heroRotate{to{transform:rotate(360deg)}}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--blue);letter-spacing:.06em;margin-bottom:22px;padding:7px 16px;background:rgba(122,162,247,.08);border:1px solid rgba(122,162,247,.25);border-radius:100px;position:relative;z-index:1}
.hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.hero h1{font-family:var(--mono);font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--text);position:relative;z-index:1}
.hero h1 .hash{color:var(--faint);font-weight:400}
.hero h1 .hl{background:linear-gradient(135deg,var(--blue),var(--purple) 40%,var(--gold) 80%,var(--blue));background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:hlShift 6s ease-in-out infinite;font-style:italic}
@keyframes hlShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-sub{margin-top:16px;font-size:14.5px;color:var(--text-2);line-height:1.8;position:relative;z-index:1;letter-spacing:.02em}
.hero-sub b{color:var(--gold)}

.search-area{padding:40px 46px 46px;text-align:center;position:relative}
.search-label{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:18px;font-weight:600}
.search-box{position:relative;max-width:520px;margin:0 auto}
.search-box input{width:100%;background:rgba(22,27,34,.9);border:2px solid var(--line-2);border-radius:16px;padding:20px 60px 20px 56px;font-size:17px;font-family:inherit;color:var(--text);outline:none;transition:all .35s cubic-bezier(.16,1,.3,1);text-align:center;letter-spacing:.03em;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.search-box input::placeholder{color:var(--faint);letter-spacing:.05em}
.search-box input:focus{border-color:var(--blue);background:#0a0e14;box-shadow:0 0 0 6px rgba(122,162,247,.15),0 0 60px -10px rgba(122,162,247,.9),inset 0 1px 0 rgba(122,162,247,.15)}
.search-box .search-ic{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted);pointer-events:none;transition:all .3s}
.search-box input:focus ~ .search-ic{color:var(--blue);transform:translateY(-50%) scale(1.15)}
.search-box .search-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--blue),var(--purple));border:none;color:#0a0e14;font-size:14px;font-weight:800;font-family:var(--mono);padding:12px 22px;border-radius:12px;cursor:pointer;letter-spacing:.06em;transition:all .35s cubic-bezier(.16,1,.3,1);box-shadow:0 4px 16px -4px rgba(122,162,247,.7)}
.search-box .search-btn:hover{transform:translateY(-50%) scale(1.06);box-shadow:0 8px 24px -6px rgba(122,162,247,1)}
.search-box .search-btn:active{transform:translateY(-50%) scale(.95)}
.search-tip{margin-top:20px;font-size:12.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.03em}
.search-tip b{color:var(--cyan);font-weight:700}

.result{padding:0 46px 46px;display:none;animation:resultIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.result.show{display:block}

.result-head{display:flex;align-items:center;gap:18px;padding:24px 0 22px;border-bottom:1px solid var(--line-2)}
.avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#0a0e14;font-family:var(--mono);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 10px 40px -10px rgba(122,162,247,1);animation:avatarGlow 3s ease-in-out infinite}
@keyframes avatarGlow{0%,100%{box-shadow:0 10px 40px -10px rgba(122,162,247,.9)}50%{box-shadow:0 10px 50px -8px rgba(122,162,247,1),0 0 40px -8px rgba(157,124,216,.8)}}
.avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%)}
.result-head .info h2{font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.result-head .info p{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.03em}

.big-score{text-align:center;padding:32px 0 28px;position:relative}
.big-score .label{font-family:var(--mono);color:var(--muted);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.big-score .num{font-family:var(--mono);font-size:84px;font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--gold);text-shadow:0 0 60px rgba(224,175,104,.6);animation:scoreGlow 4s ease-in-out infinite;display:inline-block}
@keyframes scoreGlow{0%,100%{text-shadow:0 0 60px rgba(224,175,104,.5)}50%{text-shadow:0 0 90px rgba(224,175,104,1),0 0 50px rgba(224,175,104,.6)}}
.big-score .num span{font-size:24px;color:var(--muted);font-weight:600;margin-left:8px}
.big-score .unit{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.15em;margin-top:8px}

.progress{background:var(--surface-2);border-radius:100px;height:8px;margin:22px auto 18px;max-width:460px;overflow:hidden;border:1px solid var(--line)}
.progress .fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--gold));background-size:200% 100%;box-shadow:0 0 20px rgba(122,162,247,.8);transition:width 1s cubic-bezier(.16,1,.3,1);animation:fillShift 4s linear infinite}
@keyframes fillShift{to{background-position:200% 0}}

.badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.badge{padding:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:100px;font-family:var(--mono);font-size:12.5px;color:var(--text-2);font-weight:600;letter-spacing:.03em;transition:all .3s}
.badge b{color:var(--gold);font-weight:800}
.badge.green b{color:var(--green)}
.badge.purple b{color:var(--purple)}

.items{background:linear-gradient(180deg,rgba(22,27,34,.7),rgba(13,17,23,.5));border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:20px;position:relative;overflow:hidden}
.items::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--purple),var(--gold));border-radius:16px 0 0 16px}
.items h3{font-family:var(--mono);font-size:14px;color:var(--text);margin-bottom:16px;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.items h3 .total{color:var(--gold);font-size:12.5px;font-weight:800}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:6px;background:rgba(8,9,13,.5);border-radius:10px;border:1px solid transparent;transition:all .35s cubic-bezier(.16,1,.3,1)}
.item-row:last-child{margin-bottom:0}
.item-row:hover{transform:translateX(6px);background:rgba(122,162,247,.08);border-color:rgba(122,162,247,.2)}
.item-row .left{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13.5px;color:var(--muted);font-weight:600}
.item-row .left .ic{font-size:18px}
.item-row .left .times{color:var(--faint);font-size:12px}
.item-row .right{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--faint)}
.item-row.on .left{color:var(--text-2)}
.item-row.on .right{color:var(--blue);text-shadow:0 0 12px rgba(122,162,247,.8)}
.item-row.on .left .times{color:var(--blue)}

.shop-section{background:linear-gradient(180deg,rgba(22,27,34,.7),rgba(13,17,23,.5));border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:20px}
.shop-section h3{font-family:var(--mono);font-size:14px;color:var(--text);margin-bottom:6px;letter-spacing:.05em}
.shop-section .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.7}
.shop-section .sub b{color:var(--gold);font-weight:800}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shop-item{background:rgba(8,9,13,.5);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;transition:all .35s cubic-bezier(.16,1,.3,1)}
.shop-item:hover{border-color:rgba(224,175,104,.35);transform:translateY(-4px);box-shadow:0 12px 28px -12px rgba(224,175,104,.4)}
.shop-item .emoji{font-size:44px;line-height:1;margin-bottom:10px}
.shop-item .name{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:8px}
.shop-item .pts{font-family:var(--mono);font-size:17px;font-weight:800;color:var(--gold);text-shadow:0 0 15px rgba(224,175,104,.5)}
.shop-item .pts small{font-size:10px;color:var(--muted);margin-left:2px}
.shop-item .stock{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.shop-item .stock b{color:var(--text-2);font-weight:800}
.shop-item .status{margin-top:8px;font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;letter-spacing:.03em}
.shop-item .status.can{background:rgba(126,231,135,.15);color:var(--green);border:1px solid rgba(126,231,135,.3)}
.shop-item .status.cant{background:rgba(107,118,131,.1);color:var(--muted);border:1px solid var(--line)}
.shop-item .status.out{background:rgba(247,118,142,.1);color:var(--red);border:1px solid rgba(247,118,142,.3)}

.footer{text-align:center;padding:26px 24px;border-top:1px solid var(--line);background:rgba(22,27,34,.7);font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
.footer b{color:var(--blue);font-weight:700}

.not-found{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);line-height:2;display:none}
.not-found.show{display:block}
.not-found .icon{font-size:60px;margin-bottom:20px;opacity:.3;display:block;animation:shake 2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.not-found .msg{font-size:14px}
.not-found .msg b{color:var(--red)}

.star-particle{position:fixed;pointer-events:none;z-index:9999;font-size:16px;line-height:1;animation:starFly .9s cubic-bezier(.22,1,.36,1) forwards;text-shadow:0 0 8px currentColor;will-change:transform,opacity}
@keyframes starFly{0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.2) rotate(90deg);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4) rotate(var(--rot));opacity:0}}
.halo-burst{position:fixed;pointer-events:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);z-index:9998;transform:translate(-50%,-50%);animation:haloExpand .7s cubic-bezier(.16,1,.3,1) forwards;box-shadow:0 0 20px rgba(224,175,104,.6)}
@keyframes haloExpand{0%{width:10px;height:10px;opacity:.9;border-width:3px}100%{width:90px;height:90px;opacity:0;border-width:1px}}

@media(max-width:640px){
  body{padding:16px 12px}
  .hero{padding:34px 22px 28px}
  .hero h1{font-size:28px}
  .hero-sub{font-size:13px}
  .search-area{padding:32px 22px 36px}
  .search-box input{padding:18px 54px 18px 50px;font-size:15px}
  .search-box .search-btn{padding:10px 16px;font-size:12px}
  .result{padding:0 22px 34px}
  .result-head .info h2{font-size:20px}
  .big-score .num{font-size:64px}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="wrap">
  <div class="window">
    <div class="hero">
      <div class="hero-tag"><span class="dot"></span> 编程猫 · 9月校区 · 昕言班</div>
      <h1><span class="hash"># </span>积分<span class="hl">查询</span></h1>
      <p class="hero-sub">输入孩子姓名，查看专属积分报告 · 每份努力都<b>被记录</b></p>
    </div>

    <div class="search-area">
      <div class="search-label">Search Student</div>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="请输入孩子姓名" autocomplete="off" spellcheck="false">
        <span class="search-ic">🔍</span>
        <button class="search-btn" id="searchBtn">查询</button>
      </div>
      <div class="search-tip">💡 输入<b>完整姓名</b>后点击查询 · 例如"张诗悦"</div>
    </div>

    <div class="result" id="result"></div>

    <div class="not-found" id="notFound">
      <span class="icon">🔍</span>
      <div class="msg">未找到该学生<br><b>请检查姓名是否输入正确</b></div>
    </div>

    <div class="footer">编程猫9月校区 · 昕言班专属积分榜单 · <b>仅家长查询使用</b></div>
  </div>
</div>

<script>
/* ============ 基础数据 ============ */
const RULES = [
  {key:'prepare', idx:2, label:'提前预习', pts:3, icon:'📖'},
  {key:'live',    idx:3, label:'直播上座', pts:5, icon:'📺'},
  {key:'work',    idx:4, label:'提交作品', pts:4, icon:'📝'},
  {key:'share',   idx:5, label:'群内分享', pts:3, icon:'💬'},
  {key:'ask',     idx:6, label:'问老师',   pts:3, icon:'❓'},
];
const TOTAL_WEEKS = 25;
const FULL_MAX = RULES.reduce((s,r)=>s+r.pts,0) * TOTAL_WEEKS;

const CLASSES = [
  {short:'周四班', tag:'周四战队', color:'#7aa2f7', bg:'rgba(122,162,247,.12)', emoji:'🌙'},
  {short:'周五班', tag:'周五战队', color:'#9d7cd8', bg:'rgba(157,124,216,.12)', emoji:'✦'},
  {short:'周六班', tag:'周六战队', color:'#e0af68', bg:'rgba(224,175,104,.12)', emoji:'☀'},
];

const PRODUCTS = [
  {id:'plant',  name:'好运罐装植物', emoji:'🌱', pts:300, stock:40, desc:'四叶草/向日葵/草莓/紫罗兰 随机一款'},
  {id:'heart',  name:'珍藏非洲之心', emoji:'💎', pts:400, stock:8,  desc:'闪耀黑色水晶 · 珍藏级展示盒装'},
  {id:'labubu', name:'拉布布盲盒',   emoji:'🧸', pts:450, stock:2,  desc:'POP MART 前方高能系列 · 潮玩顶流'},
];

/* ============ 解析数据 ============ */
let STUDENTS = [];
try{
  const raw = document.getElementById('STUDENT_DATA_SOURCE').textContent.trim();
  const arr = JSON.parse(raw);
  STUDENTS = arr.map(row => {
    const [name, cls, prepare, live, work, share, ask, spent] = row;
    const total = prepare*3 + live*5 + work*4 + share*3 + ask*3;
    const available = Math.max(0, total - (spent || 0));
    return { name, cls, prepare, live, work, share, ask, spent: spent||0, total, available };
  });
}catch(e){
  console.error('数据解析失败', e);
  STUDENTS = [];
}

/* ============ 背景动效 ============ */
(function initBg(){
  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W=0,H=0,particles=[],shootingStars=[],orbs=[];
  const COLORS=['122,162,247','157,124,216','224,175,104','126,231,135','126,224,247','240,160,208'];
  function resize(){
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(devicePixelRatio,devicePixelRatio);
    W=window.innerWidth; H=window.innerHeight;
    initParticles(); initOrbs();
  }
  function initParticles(){
    particles=[];
    const count = Math.min(100, Math.floor(W*H/16000));
    for(let i=0;i<count;i++){
      particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.8+.3,a:Math.random()*.5+.15,twinkle:Math.random()*Math.PI*2,twinkleSpeed:Math.random()*.025+.012,color:COLORS[Math.floor(Math.random()*COLORS.length)]});
    }
  }
  function initOrbs(){
    orbs=[];
    for(let i=0;i<6;i++){
      orbs.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:200+Math.random()*200,color:COLORS[i%COLORS.length],phase:Math.random()*Math.PI*2,phaseSpeed:.005+Math.random()*.01});
    }
  }
  function spawnShootingStar(){
    shootingStars.push({x:Math.random()*W*.8,y:Math.random()*H*.3,vx:3+Math.random()*2,vy:1.5+Math.random()*1,len:80+Math.random()*60,life:0,maxLife:90,color:COLORS[Math.floor(Math.random()*COLORS.length)]});
  }
  let lastShoot = 0;
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy; o.phase+=o.phaseSpeed;
      if(o.x<-o.r) o.x=W+o.r; if(o.x>W+o.r) o.x=-o.r;
      if(o.y<-o.r) o.y=H+o.r; if(o.y>H+o.r) o.y=-o.r;
      const pulse = .7+Math.sin(o.phase)*.3;
      const grad = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*pulse);
      grad.addColorStop(0,`rgba(${o.color},${.06*pulse})`);
      grad.addColorStop(.5,`rgba(${o.color},${.03*pulse})`);
      grad.addColorStop(1,`rgba(${o.color},0)`);
      ctx.fillStyle=grad; ctx.fillRect(o.x-o.r*pulse,o.y-o.r*pulse,o.r*pulse*2,o.r*pulse*2);
    }
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy; p.twinkle+=p.twinkleSpeed;
      if(p.x<-10) p.x=W+10; if(p.x>W+10) p.x=-10;
      if(p.y<-10) p.y=H+10; if(p.y>H+10) p.y=-10;
      const alpha = p.a*(.6+Math.sin(p.twinkle)*.4);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.color},${alpha})`; ctx.fill();
      if(p.r>1.3){
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);
        ctx.fillStyle=`rgba(${p.color},${alpha*.1})`; ctx.fill();
      }
    }
    ctx.lineWidth=.5;
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const p1=particles[i],p2=particles[j];
        const dx=p1.x-p2.x, dy=p1.y-p2.y, dist=dx*dx+dy*dy;
        if(dist<14000){
          const alpha = (1-dist/14000)*.09;
          ctx.strokeStyle=`rgba(122,162,247,${alpha})`;
          ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
        }
      }
    }
    if(t-lastShoot > 3200+Math.random()*4000){ spawnShootingStar(); lastShoot=t; }
    for(let i=shootingStars.length-1;i>=0;i--){
      const s=shootingStars[i];
      s.x+=s.vx; s.y+=s.vy; s.life++;
      const fade = 1-s.life/s.maxLife;
      if(fade<=0){ shootingStars.splice(i,1); continue; }
      const grad = ctx.createLinearGradient(s.x,s.y,s.x-s.vx*s.len/6,s.y-s.vy*s.len/6);
      grad.addColorStop(0,`rgba(${s.color},${fade})`);
      grad.addColorStop(1,`rgba(${s.color},0)`);
      ctx.strokeStyle=grad; ctx.lineWidth=1.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*s.len/6,s.y-s.vy*s.len/6); ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); requestAnimationFrame(draw);
})();

(function initFloatSparks(){
  const SPARK_COLORS = ['rgba(122,162,247,.8)','rgba(157,124,216,.8)','rgba(224,175,104,.8)','rgba(126,231,135,.8)','rgba(126,224,247,.8)','rgba(240,160,208,.8)'];
  for(let i=0;i<22;i++){
    const spark = document.createElement('div');
    spark.className = 'float-spark';
    spark.style.left = (Math.random()*100)+'vw';
    spark.style.top = (Math.random()*100)+'vh';
    const c = SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
    spark.style.background = c;
    spark.style.boxShadow = '0 0 12px 2px ' + c;
    spark.style.setProperty('--dur', (10+Math.random()*12)+'s');
    spark.style.setProperty('--delay', (-Math.random()*12)+'s');
    document.body.appendChild(spark);
  }
})();

function spawnStarBurst(x,y){
  const STAR_CHARS = ['✦','✧','★','⭐','✨','💫','🌟'];
  const COLORS = ['#e0af68','#7aa2f7','#9d7cd8','#7ee787','#f7768e','#7ee0f7','#f0a0d0','#ffffff'];
  const count = 14;
  const halo = document.createElement('div');
  halo.className = 'halo-burst';
  halo.style.left = x+'px'; halo.style.top = y+'px';
  document.body.appendChild(halo); setTimeout(()=>halo.remove(),800);
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2/count)*i + Math.random()*.5;
    const dist = 60+Math.random()*100;
    const star = document.createElement('div');
    star.className = 'star-particle';
    star.textContent = STAR_CHARS[Math.floor(Math.random()*STAR_CHARS.length)];
    star.style.left = x+'px'; star.style.top = y+'px';
    star.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
    star.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    star.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    star.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    star.style.fontSize = (14+Math.random()*14)+'px';
    document.body.appendChild(star);
    setTimeout(()=>star.remove(),1200);
  }
}

/* ============ 查询逻辑 ============ */
const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const resultEl = document.getElementById('result');
const notFoundEl = document.getElementById('notFound');

function doSearch(){
  const query = input.value.trim();
  if(!query){
    resultEl.classList.remove('show');
    notFoundEl.classList.remove('show');
    input.focus();
    return;
  }
  // 精确匹配优先，然后模糊匹配
  let matched = STUDENTS.filter(s => s.name === query);
  if(!matched.length) matched = STUDENTS.filter(s => s.name.includes(query) || query.includes(s.name));
  
  if(!matched.length){
    resultEl.classList.remove('show');
    notFoundEl.classList.add('show');
    input.focus();
    return;
  }
  
  notFoundEl.classList.remove('show');
  renderStudent(matched[0]);
  
  // 星星特效
  const r = btn.getBoundingClientRect();
  spawnStarBurst(r.left + r.width/2, r.top + r.height/2);
}

function renderStudent(s){
  const c = CLASSES[s.cls] || CLASSES[0];
  const pct = Math.min(100, Math.round(s.total / FULL_MAX * 100));
  const initial = s.name.charAt(0);
  
  const itemsHTML = RULES.map(r => {
    const cnt = s[r.key] || 0;
    const sub = cnt * r.pts;
    return `<div class="item-row ${cnt > 0 ? 'on' : ''}">
      <div class="left">
        <span class="ic">${r.icon}</span>
        <span>${r.label}</span>
        <span class="times">× ${cnt}</span>
      </div>
      <div class="right">${cnt > 0 ? '+'+sub+' 分' : '0 分'}</div>
    </div>`;
  }).join('');
  
  const shopHTML = PRODUCTS.map(p => {
    const can = s.available >= p.pts;
    let statusCls = 'cant';
    let statusTxt = `还差 ${p.pts - s.available} 分`;
    if(p.stock <= 0){
      statusCls = 'out';
      statusTxt = '已售罄';
    } else if(can){
      statusCls = 'can';
      statusTxt = '✓ 可兑换';
    }
    return `<div class="shop-item">
      <div class="emoji">${p.emoji}</div>
      <div class="name">${p.name}</div>
      <div class="pts">${p.pts}<small>分</small></div>
      <div class="stock">库存 <b>${p.stock}</b></div>
      <div class="status ${statusCls}">${statusTxt}</div>
    </div>`;
  }).join('');
  
  resultEl.innerHTML = `
    <div class="result-head">
      <div class="avatar">${initial}</div>
      <div class="info">
        <h2>${s.name}</h2>
        <p>${c.emoji} ${c.tag} · ${c.short}</p>
      </div>
    </div>
    
    <div class="big-score">
      <div class="label">累计积分</div>
      <div class="num">${s.total}<span>/ ${FULL_MAX}</span></div>
      <div class="unit">Cumulative Score</div>
    </div>
    
    <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    
    <div class="badges">
      <div class="badge green">完成度 <b>${pct}%</b></div>
      <div class="badge purple">可用 <b>${s.available} 分</b></div>
      ${s.spent > 0 ? `<div class="badge">已消耗 <b>${s.spent} 分</b></div>` : ''}
    </div>
    
    <div class="items">
      <h3>积分明细 <span class="total">${s.total} / ${FULL_MAX}</span></h3>
      ${itemsHTML}
    </div>
    
    <div class="shop-section">
      <h3>🎁 积分商城</h3>
      <div class="sub">用可用积分兑换心仪礼物 · 最低 300 分起兑 · 库存实时更新</div>
      <div class="shop-grid">${shopHTML}</div>
    </div>
  `;
  
  resultEl.classList.remove('show');
  // 触发重绘，让动画重新播放
  void resultEl.offsetWidth;
  resultEl.classList.add('show');
  
  // 滚动到结果
  setTimeout(()=>{
    resultEl.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

input.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
btn.addEventListener('click', doSearch);
input.addEventListener('input', ()=>{
  if(!input.value.trim()){
    resultEl.classList.remove('show');
    notFoundEl.classList.remove('show');
  }
});

// 自动聚焦
setTimeout(()=> input.focus(), 400);
</script>
</body>
</html>
